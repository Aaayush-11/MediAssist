[project]
name = "mediassist"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.1.0",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.9",
    "sse-starlette>=3.7.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
